      <feMorphology operator="dilate" radius="1.5" />
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>
  <path
    d="M -15 90
       C -7 79, -3 70, 2 63
       C 6 57, 12 55, 18 49
       C 22 45, 26 44, 27 38
       C 28 33, 27 28, 26 25
       C 25 22, 26 18, 28 14
       C 30 9, 34 8, 39 5
       C 43 1, 50 1, 57 0
       C 65 -1, 72 2, 82 -2
       L 120 -20 L 120 120 L -15 120 Z"
    fill="white"
    filter="url(#outer-feather)"
  />
</svg>
